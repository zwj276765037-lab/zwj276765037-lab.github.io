<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>卓文俊 · 边缘端推理硬件</title>
<meta name="description" content="卓文俊，广东工业大学集成电路学院硕士研究生。研究二值/三值权重 Transformer 的 FPGA 加速器（BAPE，IEEE TCSI 2026 共同第一作者）。">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23111'/%3E%3Ctext x='32' y='46' font-family='Inter,sans-serif' font-size='38' font-weight='700' fill='%23fff' text-anchor='middle'%3E卓%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* ------------------------------------------------------------------
     结构照 ashton.is 复刻：白纸、大字号、角色轮播、居中陈述、作品格、三栏页脚
     内容全部是卓文俊自己的；图片是他自己的图。
     ------------------------------------------------------------------ */
  :root{
    --paper:#fff; --ink:#111; --ink-2:#444; --muted:#6b6b6b; --soft:#f2f2f2;
    --frame:1240px; --wide:1080px; --text:704px;
    --gutter:clamp(16px,3.5vw,50px);
    --g:clamp(12px,1.7vw,24px);
    --fs:clamp(16px,.19vw + 15.3px,18px);
    --fs-ui:clamp(15px,.65vw + 12.6px,22px);
    --fs-big:clamp(26px,1.53vw + 20px,42px);
    --fs-mid:clamp(20px,.77vw + 16.9px,28px);
    --ease:cubic-bezier(.4,0,.2,1);
    --head-h:92px;
  }
  html[data-theme="dark"]{--paper:#0d0d0d; --ink:#f2f2f2; --ink-2:#c9c9c9; --muted:#8a8a8a; --soft:#1a1a1a;}
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
  body{
    background:var(--paper);color:var(--ink);
    font-family:Inter,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    font-size:var(--fs);line-height:1.6;-webkit-font-smoothing:antialiased;
    transition:background .35s var(--ease),color .35s var(--ease);
  }
  a{color:inherit;text-decoration:none}
  a:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
  .wrap{max-width:var(--frame);margin:0 auto;padding:0 var(--gutter)}

  /* 顶栏：右侧一排，随滚动压扁 */
  header{position:sticky;top:0;z-index:30;background:transparent;
    transition:background .35s var(--ease),box-shadow .2s var(--ease)}
  header.stuck{background:var(--paper);box-shadow:0 1px 0 rgba(0,0,0,.08)}
  .head-in{max-width:var(--frame);margin:0 auto;padding:0 var(--gutter);
    height:var(--head-h);display:flex;align-items:center;justify-content:flex-end;gap:clamp(16px,2vw,34px);
    transition:height .3s var(--ease)}
  header.stuck .head-in{height:58px}
  nav{display:flex;align-items:center;gap:clamp(16px,2vw,34px);font-size:var(--fs-ui)}
  nav a{opacity:.92;transition:opacity .2s}
  nav a:hover{opacity:.55}
  .theme-btn{display:inline-flex;align-items:center;gap:8px;background:none;border:0;color:inherit;
    font:inherit;font-size:var(--fs-ui);cursor:pointer;padding:4px 0}
  .theme-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6}
  .theme-btn:hover{opacity:.55}

  /* 首屏：大字号 + 角色轮播 */
  .topband{background:var(--soft)}
  .hero{padding:clamp(40px,7vw,96px) 0 clamp(30px,4vw,60px);min-height:calc(100vh - var(--head-h));
    display:flex;flex-direction:column;justify-content:space-between;position:relative}
  .hero h1{font-weight:700;letter-spacing:-.02em;line-height:1.04;
    font-size:clamp(40px,8.4vw,118px);max-width:12em}
  .hero h1 .role-line{display:block;font-weight:400;letter-spacing:-.015em;min-height:1.04em}
  .role{display:inline-block;will-change:transform,opacity}
  .hero-foot{display:flex;align-items:center;justify-content:flex-end;gap:14px;margin-top:clamp(28px,5vw,72px)}
  .dots{display:flex;align-items:center;gap:10px}
  .dots button{width:9px;height:9px;padding:0;border-radius:50%;border:1px solid var(--muted);
    background:transparent;cursor:pointer;transition:background .2s,border-color .2s}
  .dots button[aria-current="true"]{background:var(--ink);border-color:var(--ink)}
  .dots button:hover{border-color:var(--ink)}
  .pause{background:none;border:0;cursor:pointer;color:var(--muted);font-size:13px;letter-spacing:.06em;
    display:inline-flex;align-items:center;gap:6px;padding:2px 0}
  .pause:hover{color:var(--ink)}
  .pause svg{width:11px;height:11px;fill:currentColor}

  /* 陈述段 */
  .intro{padding:clamp(60px,10vw,150px) 0 clamp(40px,6vw,80px);text-align:center}
  .intro p{font-size:var(--fs-big);line-height:1.35;letter-spacing:-.01em;max-width:var(--text);margin:0 auto;
    text-wrap:balance}
  .intro .where{margin-top:22px;font-size:calc(var(--fs) - 2px);color:var(--muted)}

  /* 作品格 */
  .work{padding:clamp(20px,4vw,60px) 0 clamp(40px,6vw,80px)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--g);max-width:var(--wide);margin:0 auto}
  .item{display:block}
  .item figure{margin:0;overflow:hidden;background:var(--soft);aspect-ratio:16/10}
  .item img{display:block;width:100%;height:100%;object-fit:cover;
    transition:transform .6s var(--ease),filter .3s var(--ease)}
  .item:hover img{transform:scale(1.03)}
  .item figcaption{display:flex;justify-content:space-between;gap:16px;margin-top:10px;
    font-size:calc(var(--fs) - 3px);color:var(--muted);line-height:1.5}
  .item figcaption b{font-weight:500;color:var(--ink);font-size:calc(var(--fs) - 2px)}
  .all-work{max-width:var(--wide);margin:clamp(26px,3.4vw,44px) auto 0;font-size:var(--fs);display:inline-block}
  .all-work:hover{opacity:.55}
  .all-wrap{max-width:var(--wide);margin:0 auto}

  /* 页脚 */
  footer{background:var(--soft);padding:clamp(34px,4.4vw,64px) 0 clamp(26px,3.4vw,44px);margin-top:clamp(40px,6vw,90px);
    transition:background .35s var(--ease)}
  .foot-grid{max-width:var(--frame);margin:0 auto;padding:0 var(--gutter);
    display:grid;grid-template-columns:1.1fr 1fr .8fr;gap:clamp(20px,4vw,60px);align-items:start}
  .foot-grid .mark{width:34px;height:34px;border:1.5px solid var(--ink);border-radius:50%;
    display:grid;place-items:center;font-size:15px;font-weight:700;margin-bottom:14px}
  .foot-grid p{font-size:calc(var(--fs) - 3px);line-height:1.75;color:var(--ink-2)}
  .foot-grid p.dim{color:var(--muted)}
  .to-top{margin-top:18px;display:inline-block;font-size:calc(var(--fs) - 3px);color:var(--ink-2)}
  .to-top:hover{opacity:.55}
  .mail{font-size:var(--fs);color:var(--ink);display:inline-flex;align-items:center;gap:8px}
  .mail:hover{opacity:.6}
  .foot-links{display:flex;flex-direction:column;gap:8px;font-size:calc(var(--fs) - 3px);color:var(--ink-2)}
  .foot-links a:hover{opacity:.55}
  .foot-links .row{display:flex;gap:16px;margin-top:4px}
  .copy{max-width:var(--frame);margin:clamp(26px,3.4vw,44px) auto 0;padding:0 var(--gutter);
    display:flex;justify-content:flex-end;font-size:12px;color:var(--muted)}

  /* 角色切换动画 */
  @keyframes roleIn{from{opacity:0;transform:translateY(.22em)}to{opacity:1;transform:none}}
  .role.in{animation:roleIn .38s var(--ease) both}

  @media (max-width:820px){
    .head-in{height:64px}
    .hero{min-height:0;padding-top:24px}
    .hero h1{font-size:clamp(36px,11.5vw,64px)}
    .grid{grid-template-columns:1fr}
    .foot-grid{grid-template-columns:1fr;gap:26px}
    .copy{justify-content:flex-start}
  }
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    .role.in{animation:none}
    .item img{transition:none}
  }
</style>
</head>
<body>

<div class="topband">
<header id="head">
  <div class="head-in">
    <nav>
      <a href="#work">工作</a>
      <a href="#about">关于</a>
      <a href="#contact">联系</a>
    </nav>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="切换深浅色">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <span id="themeLabel">暗色</span>
    </button>
  </div>
</header>

  <section class="hero wrap">
    <h1>
      卓文俊是
      <span class="role-line"><span class="role in" id="role">一个研究者。</span></span>
    </h1>
    <div class="hero-foot">
      <div class="dots" id="dots" role="tablist" aria-label="切换身份"></div>
      <button class="pause" id="pause" type="button" aria-label="暂停轮播">
        <svg viewBox="0 0 12 12" aria-hidden="true"><rect x="2" y="1" width="3" height="10"/><rect x="7" y="1" width="3" height="10"/></svg>
        <span id="pauseLabel">暂停</span>
      </button>
    </div>
  </section>

  <section class="intro">
    <p>在研究怎么把一个大模型，塞进一块边缘的 FPGA 里。</p>
    <p class="where">广州 · 广东工业大学 集成电路学院</p>
  </section>

  <section class="work" id="work">
    <div class="wrap">
      <div style="max-width:var(--wide);margin:0 auto">
        <div class="grid">
          <a class="item" href="#work">
            <figure><img src="assets/work/diagram.png" alt="候选空间示意图"></figure>
            <figcaption><b>BAPE</b><span>论文 · IEEE TCSI 2026</span></figcaption>
          </a>
          <a class="item" href="#work">
            <figure><img src="assets/work/pixel.png" alt="像素人像"></figure>
            <figcaption><b>像素版的我</b><span>实验 · 112×116</span></figcaption>
          </a>
          <a class="item" href="#work">
            <figure><img src="assets/work/notes.png" alt="技术笔记卡片"></figure>
            <figcaption><b>技术笔记</b><span>写作中 · 三篇</span></figcaption>
          </a>
          <a class="item" href="#work">
            <figure><img src="assets/work/essays.png" alt="随笔卡片"></figure>
            <figcaption><b>随笔</b><span>写作中 · 三件小事</span></figcaption>
          </a>
        </div>
        <div class="all-wrap"><a class="all-work" href="#work">全部工作 →</a></div>
      </div>
    </div>
  </section>
</main>

<footer id="contact">
  <div class="foot-grid">
    <div id="about">
      <div class="mark">卓</div>
      <p>卓文俊<br>集成电路 · 硕士在读</p>
      <p class="dim">广东工业大学集成电路学院，广州</p>
      <a class="to-top" href="#top">↑ 回到顶部</a>
    </div>
    <div>
      <a class="mail" href="mailto:zhuowenjun1@mails.gdut.edu.cn">✉ zhuowenjun1@mails.gdut.edu.cn</a>
    </div>
    <div class="foot-links">
      <a href="#work">工作</a>
      <a href="#about">关于</a>
      <a href="#contact">联系</a>
      <div class="row">
        <a href="https://github.com/zwj276765037-lab" target="_blank" rel="noopener">GitHub</a>
        <a href="https://doi.org/10.1109/TCSI.2026.3727987" target="_blank" rel="noopener">论文</a>
      </div>
    </div>
  </div>
  <div class="copy">© 2026 卓文俊</div>
</footer>

<script>
(function () {
  // ---------- 身份轮播 ----------
  var roles = ['一个研究者。', '一个硕士生。', '一个写 RTL 的人。', '一个像素画作者。', '一个广州人。', '一个在把乘法换成查表的人。'];
  var roleEl = document.getElementById('role');
  var dotsEl = document.getElementById('dots');
  var pauseBtn = document.getElementById('pause');
  var pauseLabel = document.getElementById('pauseLabel');
  var i = 0, timer = null, paused = false;

  roles.forEach(function (_, k) {
    var b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('aria-label', '第 ' + (k + 1) + ' 个身份');
    b.setAttribute('aria-current', k === 0 ? 'true' : 'false');
    b.addEventListener('click', function () { show(k); restart(); });
    dotsEl.appendChild(b);
  });
  var dots = [].slice.call(dotsEl.children);

  function show(k) {
    i = (k + roles.length) % roles.length;
    roleEl.classList.remove('in');
    void roleEl.offsetWidth;
    roleEl.textContent = roles[i];
    roleEl.classList.add('in');
    dots.forEach(function (d, n) { d.setAttribute('aria-current', n === i ? 'true' : 'false'); });
  }
  function tick() { show(i + 1); }
  function start() { if (!timer && !paused) timer = setInterval(tick, 3000); }
  function stop() { clearInterval(timer); timer = null; }
  function restart() { stop(); start(); }

  pauseBtn.addEventListener('click', function () {
    paused = !paused;
    pauseLabel.textContent = paused ? '播放' : '暂停';
    pauseBtn.setAttribute('aria-label', paused ? '继续轮播' : '暂停轮播');
    if (paused) stop(); else start();
  });

  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) start();

  // ---------- 深浅色 ----------
  var root = document.documentElement;
  var btn = document.getElementById('themeBtn');
  var label = document.getElementById('themeLabel');
  var saved = null;
  try { saved = localStorage.getItem('theme'); } catch (e) {}
  if (saved) setTheme(saved);
  function setTheme(t) {
    root.setAttribute('data-theme', t);
    label.textContent = t === 'dark' ? '浅色' : '暗色';
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', t === 'dark' ? '#0d0d0d' : '#ffffff');
    try { localStorage.setItem('theme', t); } catch (e) {}
  }
  btn.addEventListener('click', function () {
    setTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });

  // ---------- 顶栏压扁 ----------
  var head = document.getElementById('head');
  var onScroll = function () { head.classList.toggle('stuck', window.scrollY > 24); };
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
})();
</script>
</body>
</html>
